name: ci
# Generated by dep-sweep enroll — baseline CI for a repo with no tests/build: a secret scan plus syntax checks.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0                 # full history so gitleaks scans past commits too
      - name: Secrets - gitleaks (fatal on a real leak)
        run: |
          GL=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GL}/gitleaks_${GL}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" detect --source . --redact --no-banner --exit-code 1
      - name: Syntax checks
        run: |
          set -e
          # Scripts are found by SHEBANG, not extension. On 2026-10-12 the first
          # enrolled repo (claude-box-updates) had two bash scripts with no .sh
          # suffix -- box-update-system and box-update-reboot, the two most
          # consequential files in it -- and this step silently skipped both. A
          # syntax check that quietly covers less than you think is worse than
          # none, because the green tick is doing the lying.
          git ls-files | while read -r f; do
            head -1 "$f" 2>/dev/null | grep -qE '^#!.*(bash|sh)' && echo "$f"
          done > "$RUNNER_TEMP/shfiles"
          while read -r f; do bash -n "$f"; done < "$RUNNER_TEMP/shfiles"
          git ls-files | while read -r f; do
            head -1 "$f" 2>/dev/null | grep -qE '^#!.*python' && echo "$f"
          done > "$RUNNER_TEMP/pyfiles"
          git ls-files '*.py' >> "$RUNNER_TEMP/pyfiles"
          sort -u "$RUNNER_TEMP/pyfiles" | xargs -r python3 -m py_compile
          git ls-files '*.json' | while read -r f; do python3 -c 'import json,sys; json.load(open(sys.argv[1]))' "$f"; done
